      <tr><td><kbd>PgUp</kbd> / <kbd>PgDn</kbd></td><td>Navegar entre páginas</td></tr>
      <tr><td><kbd>+</kbd> / <kbd>−</kbd> / <kbd>0</kbd> / <kbd>1</kbd></td><td>Zoom: mais / menos / ajustar / 100%</td></tr>
      <tr><td><kbd>Ctrl</kbd> + roda</td><td>Zoom com a roda do mouse</td></tr>
      <tr><td><kbd>D</kbd> / <kbd>G</kbd> / <kbd>M</kbd></td><td>Modo desenho / grade / mudo</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Sair do desenho, fechar painéis, cancelar edição</td></tr>
    </table>
    <div class="help-note">🖱️ <b>Duplo clique</b>: edita textos e notas, troca fotos, abre a gaveta de adesivos.<br>
    🖱️ <b>Botão direito</b> em um item: duplicar, camadas e excluir. Na página vazia: colar e criar.<br>
    📥 <b>Arraste imagens</b> do computador direto para a página — várias de uma vez!<br>
    📄 O <b>PDF em alta qualidade</b> renderiza cada página em ~3× a resolução, com fontes e filtros fiéis ao que você vê.</div>
  </div>
  <div class="m-foot"><button class="mbtn solid" data-act="modal-close">Entendi! ✨</button></div>`);
}

/* ---------- exports ---------- */
function exportJSON(){
  const data={app:'album-recordacoes',version:2,exportedAt:new Date().toISOString(),album:S.album};
  download(new Blob([JSON.stringify(data)],{type:'application/json'}),slug(S.album.name)+'-backup.json');
  Audio2.play('chime');toast('success','Backup .json exportado 📦 — guarde em local seguro!');
}
async function exportPNG(){
  if(BUSY)return;BUSY=true;
  try{await ensureFonts();
    const scale=Math.min(2.5,4096/Math.max(S.album.pageW,S.album.pageH));
    const cv=await renderPageToCanvas(curPage(),scale);
    downloadURL(cv.toDataURL('image/png'),slug(S.album.name)+'-pagina-'+(S.page+1)+'.png');
    Audio2.play('shutter');toast('success','Página exportada como PNG 🖼️');
  }catch(e){toast('danger','Não foi possível gerar o PNG.')}
  finally{BUSY=false}
}
async function exportPDF(){
  if(BUSY)return;
  const jsPDF=window.jspdf&&window.jspdf.jsPDF;
  if(!jsPDF){
    toast('warn','A biblioteca de PDF não carregou (sem internet?). Exportando a página atual como PNG…');
    exportPNG();return;
  }
  BUSY=true;$('#btnPDF').disabled=true;
  openModal('progress',`<div class="m-head"><span class="ic">📄</span><div><b>Gerando seu álbum em PDF…</b><small>Preparando páginas em alta resolução</small></div></div>
  <div class="m-body"><div class="prog-wrap"><div class="big">🖨️</div><p id="progLabel">Carregando fontes…</p>
  <div class="prog-bar"><i id="progBar"></i></div><div class="prog-pct" id="progPct">0%</div></div></div>`,{locked:true,cls:'small'});
  const setProg=(pct,label)=>{const b=$('#progBar'),l=$('#progLabel'),p=$('#progPct');
    if(b)b.style.width=pct+'%';if(l)l.textContent=label;if(p)p.textContent=Math.round(pct)+'%'};
  try{
    await ensureFonts();setProg(6,'Fontes prontas ✓');
    const {pageW,pageH}=S.album,n=S.album.pages.length;
    const scale=Math.min(3,4096/Math.max(pageW,pageH));
    const orient=pageW>=pageH?'landscape':'portrait';
    const pdf=new jsPDF({orientation:orient,unit:'pt',format:[pageW,pageH],compress:true});
    for(let i=0;i<n;i++){
      setProg(6+(i/n)*86,`Preparando página ${i+1} de ${n} — ${S.album.pages[i].name}`);
      await new Promise(r=>setTimeout(r,30));
      const cv=await renderPageToCanvas(S.album.pages[i],scale);
      const url=cv.toDataURL('image/jpeg',.92);
      if(i>0)pdf.addPage([pageW,pageH],orient);
      pdf.addImage(url,'JPEG',0,0,pageW,pageH);
      cv.width=0;cv.height=0;
      setProg(6+((i+1)/n)*86,`Página ${i+1} de ${n} pronta ✓`);
    }
    setProg(96,'Montando o arquivo final…');
    await new Promise(r=>setTimeout(r,40));
    pdf.save(slug(S.album.name)+'.pdf');
    setProg(100,'Álbum completo! 🎉');
    await new Promise(r=>setTimeout(r,450));
    closeModal();Audio2.play('chime');
    toast('success','PDF em alta qualidade criado! 📄✨ ('+n+' páginas)');
  }catch(e){
    closeModal();toast('danger','Algo deu errado ao gerar o PDF. Tente novamente ou exporte as páginas em PNG.');
  }finally{BUSY=false;$('#btnPDF').disabled=false}
}

/* ---------- global listeners ---------- */
window.addEventListener('resize',debounce(()=>{if(S.fitMode)fitZoom();else syncZoomLayout();
  quickBar.classList.toggle('show',!!S.sel&&isMobile());
  if(!isMobile()){panelEl.classList.remove('open')}},150));
document.addEventListener('pointerdown',e=>{
  if(isMobile()&&drawerEl.classList.contains('open')&&!e.target.closest('#drawer')&&!e.target.closest('#rail')&&!e.target.closest('#modalRoot'))closeDrawer();
  if(isMobile()&&panelEl.classList.contains('open')&&!e.target.closest('#panel')&&!e.target.closest('#panelFab')&&!e.target.closest('#quickBar')&&!e.target.closest('#modalRoot')&&!e.target.closest('#drawer')&&!e.target.closest('#rail')){panelEl.classList.remove('open');refitSoon()}
},true);
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')nameInput.blur();e.stopPropagation()});

/* ---------- init ---------- */
function init(){
  const prefs=loadPrefs();
  syncSoundBtn();
  let loaded=null;
  try{const raw=JSON.parse(localStorage.getItem(LS_CUR)||'null');
    if(raw&&raw.album)loaded={album:normalizeAlbum(raw.album),page:raw.page||0};
  }catch(e){}
  if(loaded){S.album=loaded.album;S.page=clamp(loaded.page,0,S.album.pages.length-1)}
  else{S.album=buildDemo();S.page=0}
  nameInput.value=S.album.name;
  resetHistory();
  renderPage();buildStrip();buildPanel();syncRail();
  fitZoom();
  setStatus('saved');
  document.fonts.ready.then(()=>{measureTexts();syncSel();buildStrip();
    if(S.tool==='paginas')buildDrawer()}).catch(()=>{});
  if(!prefs.seen){
    savePrefs();
    setTimeout(()=>{toast('info','Bem-vindo ao seu ateliê! 📔 Este álbum de exemplo é <b>todo editável</b> — arraste as fotos, clique nos textos, explore as ferramentas.',{label:'Ver dicas',fn:openHelp});
      $('#toolFotos').classList.add('pulse');setTimeout(()=>$('#toolFotos').classList.remove('pulse'),6000)},700);
  }
}
init();
</script>
